<div class="ar-job-card__container">
  <div class="card ar-job-card mb-3" [class.active]="isActiveJob">
    <div class="row g-0 flex-grow-1 ar-job-card__content">
      <div class="card-group ar-art-card-group pt-3">
        @if (artwork$ | async; as artwork) {
          @if (artwork.length > 0) {
            @for (art of artwork; track trackByArtId(art)) {
              <app-art-thumbnail-card
                [art_id]="art.art_id"
                [job_id]="job_id"
                [draggable]="true"
                [isActiveArt]="activeArt === art.art_id"
                (click)="onClickArt($event, art.art_id)"
              ></app-art-thumbnail-card>
            }
          } @else {
            <p class="ms-3">No artwork</p>
          }
        } @else {
          <p class="ms-3">No artwork</p>
        }
      </div>
    </div>
    <!-- clicking on the card footer selects the job as the target for assigning the selected art -->
    <div class="row g-0" [class.hover]="true" (click)="onClickFooter($event)">
      <div
        class="card-footer ar-job-card-footer"
        [class.warehouse-footer]="job_id === WAREHOUSE_JOB_ID"
      >
        <p class="mb-0 fst-italic">{{ cardFooterContent }}</p>
      </div>
    </div>
  </div>
</div>
